name: Build NEURA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Ensure SDK platform 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            sdkmanager --install "platforms;android-35" || true
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install "build-tools;35.0.0" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEURA-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEURA-AI-apk
          path: NEURA-AI.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neura-latest
          name: NEURA app (Android APK)
          body: |
            Install: download NEURA-AI.apk below and tap it on your Android phone.
            Android may ask once to allow installing from this source - allow it.
          files: NEURA-AI.apk
