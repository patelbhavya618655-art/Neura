<meta name="application-name" content="NEURA">
<style>
:root{--bg:#000;--cd:#171717;--tx:#f2f2f2;--mu:#8d8d8d;--bd:#2c2c2c;--ac:#10a37f}
:root[data-t=light]{--bg:#fff;--cd:#f0f0f0;--tx:#111;--mu:#767676;--bd:#e2e2e2}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#sp{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#sp.h{opacity:0;visibility:hidden}
.lg{width:64px;height:64px;opacity:0;transform:translateY(-240px);animation:dr .9s cubic-bezier(.34,1.56,.64,1) 1s forwards}
@keyframes dr{0%{opacity:0;transform:translateY(-240px)}55%{opacity:1;transform:translateY(16px)}75%{transform:translateY(-6px)}100%{opacity:1;transform:none}}
.wd{overflow:hidden;max-width:0;opacity:0;white-space:nowrap;font-size:26px;font-weight:800;color:#f5f5f5;animation:wi .8s ease 3.4s forwards}
.wd b{color:var(--ac)}
@keyframes wi{to{max-width:220px;opacity:1;margin-left:12px}}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:10px 12px}
header button{padding:8px;border-radius:50%}
#ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:18px}
.em{margin:auto;text-align:center;color:var(--mu)}.em svg{margin:0 auto 12px}
.u{align-self:flex-end;max-width:85%;background:var(--cd);padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.u i{color:var(--mu);font-size:13px}
.a .tx{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.a .ac{display:flex;gap:4px;margin-top:6px;color:var(--mu)}.ac button{padding:6px}
.st{color:var(--mu);font-size:14px;margin-top:6px}
.sb{margin-top:6px;border:1px solid var(--bd);border-radius:14px;padding:4px 12px;font-size:13px}
.cc{background:var(--cd);border-radius:12px;padding:10px;margin:8px 0;position:relative;white-space:normal}
.cc pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin-top:18px}
.cc button{position:absolute;right:8px;top:6px;font-size:12px;color:var(--ac)}
#chip{padding:0 16px}
.ch{display:inline-flex;gap:8px;background:var(--cd);border-radius:12px;padding:6px 10px;font-size:13px;margin-bottom:6px}
.bar{display:flex;align-items:flex-end;gap:6px;margin:6px 12px calc(10px + env(safe-area-inset-bottom));background:var(--cd);border-radius:26px;padding:6px}
.bar button{padding:9px;border-radius:50%}
#inp{flex:1;background:none;border:0;color:var(--tx);font:inherit;resize:none;max-height:120px;padding:9px 4px;outline:0}
#act{background:var(--ac);color:#fff}
.sh{position:fixed;left:12px;bottom:80px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:6px;display:none;z-index:20}
.sh.on{display:block}.sh button{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
#mn{left:auto;right:12px;top:54px;bottom:auto}
#sc{position:fixed;inset:0;background:#0008;display:none;z-index:30}#sc.on{display:block}
#dr{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:340px;background:var(--bg);border-right:1px solid var(--bd);z-index:31;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#dr.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px}
.dh b{font-size:20px}.dh b span,.ac2{color:var(--ac)}
.nb{border:1px solid var(--bd);border-radius:12px;padding:6px 12px}
#sq{margin:0 14px 8px;background:var(--cd);border:0;border-radius:12px;padding:10px;color:var(--tx);font:inherit;outline:0}
#cl{flex:1;overflow:auto}
.ci{padding:12px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.ci.on{background:var(--cd)}
.df{border-top:1px solid var(--bd)}.df button{display:block;width:100%;text-align:left;padding:13px 16px}
#pg{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#pg.on{display:flex}
#pgb{flex:1;overflow:auto;padding:4px 16px 20px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.mu{color:var(--mu);font-size:14px}
.in{width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px;color:var(--tx);font:inherit;margin:6px 0 12px;outline:0}
.pb{background:var(--tx);color:var(--bg);border-radius:24px;padding:11px 20px;font-weight:600;margin:6px 6px 0 0}.pb.g{background:var(--cd);color:var(--tx)}
.card{background:var(--cd);border-radius:16px;padding:16px;margin:12px 0}
.r{display:flex;justify-content:space-between}.r.s{font-size:13px;color:var(--mu);margin-top:6px}
.tr{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.tr i{display:block;height:100%;border-radius:6px}
.ub{margin-bottom:18px}
.seg{display:flex;background:var(--cd);border-radius:20px;padding:3px;margin:8px 0}.seg button{flex:1;padding:8px;border-radius:18px}.seg .on{background:var(--tx);color:var(--bg)}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#ts.on{opacity:1}
#md{position:fixed;inset:0;background:#000a;z-index:70;display:none;align-items:center;justify-content:center;padding:20px}#md.on{display:flex}
.mb{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:340px;max-height:88%;overflow:auto}.mb h3{margin-bottom:10px}.mb label{font-size:13px;color:var(--mu)}
.cp{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.cp button{border:1px solid var(--bd);border-radius:16px;padding:6px 12px}.cp .on{background:var(--tx);color:var(--bg)}
.gr{font-size:22px;font-weight:700;margin-bottom:14px;color:var(--tx)}.sg{display:block;width:100%;text-align:left;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px;color:var(--mu)}
header button{padding:10px;border-radius:12px;background:var(--cd)}#ttl{font-size:18px}
.em{margin:auto 0 24px;text-align:left;width:100%}.em svg{margin:0 0 26px}.gr2{font-size:20px}.hd{font-size:32px;font-weight:800;line-height:1.15;margin:2px 0 18px;color:var(--tx)}
.sg{display:flex;align-items:center;gap:14px;border:1px solid var(--bd);background:#0b0b0b;border-radius:30px;padding:16px 18px;margin-top:12px;color:var(--tx);width:100%;text-align:left;font-size:16px}

const DOC={
about:['About NEURA',[['About NEURA',`NEURA is an AI-powered chat assistant developed by Patel Bhavya. It is designed to help users write, learn, code, solve problems, understand images and files, and interact with AI through a simple and modern interface.`],['Capabilities',`NEURA supports multiple AI-powered capabilities, including text conversations, image understanding, file analysis, voice input, and read-aloud features, depending on the current version.`],['Built-in AI Agents',`Neel — A Study & Knowledge AI Agent that explains difficult topics in simple language, solves academic questions step by step, and creates summaries and study guides.\n\nVira — A Coding & Development AI Agent that helps write, debug, explain and improve code and build websites, apps and games.\n\nArya (Pro) — A Research, Analysis & Strategy AI Agent that compares options, weighs risks and trade-offs, and gives well-reasoned recommendations.\n\nVeer (Pro) — An Advanced & Complex Tasks AI Agent for multi-step problems, detailed planning and advanced reasoning.`],['Our Aim',`NEURA aims to make artificial intelligence accessible, useful, and easy to use for students, developers, creators, and everyday users.`],['Please Note',`AI-generated responses may contain mistakes or outdated information. Users should verify important information before relying on it.`],['Details',`Developer: Patel Bhavya\nProduct: NEURA\nStatus: Preview / Development Edition`]]],
privacy:['Privacy Policy',[[null,`NEURA respects user privacy and is designed to give users control over their conversations and application settings.`],['1. Information You Provide',`When using NEURA, users may provide text messages, images, files, voice input, and other information required to use available AI features.`],['2. AI Processing',`To generate AI responses, messages and supported attachments may be transmitted to the configured AI provider. The provider may process this information according to its own privacy practices and applicable policies.`],['3. Local Storage',`Depending on the current implementation, NEURA may store chat history, preferences, agent settings, and other application information locally on the user's device.`],['4. Built-in AI Agents',`Conversations with the built-in agents (Neel, Vira, Arya and Veer) may be processed in the same way as other NEURA AI conversations, depending on the features being used.`],['5. Files and Images',`Images and files uploaded for AI analysis may be transmitted to the configured AI provider to process the user's request.`],['6. Voice Features',`When voice input or read-aloud features are available, audio-related information may be processed by the browser or the service providing that functionality.`],['7. Sensitive Information',`Users should avoid submitting passwords, banking information, authentication codes, private keys, or other highly sensitive information.`],['8. Deleting Conversations',`If NEURA provides a chat deletion option, users can delete available conversations through the chat interface. Locally stored information may also be removed by clearing application data or browser storage, depending on the implementation. Deleting local data does not necessarily delete information already processed or retained by an AI provider.`],['9. Policy Updates',`This Privacy Policy may be updated when NEURA introduces new features, changes its data handling practices, or improves its services.`],['10. Privacy Reminder',`No online service can guarantee complete privacy or security. Users should review this policy and avoid submitting information they do not want processed by the configured AI services.`]]],
security:['Security',[[null,`NEURA is designed with security in mind and aims to protect user information through appropriate security practices.`],['1. Secure Connection',`NEURA uses HTTPS when deployed through a properly configured secure web connection. HTTPS helps protect information during transmission between the user's browser and the server.`],['2. Server Protection',`Server credentials should be stored securely and should never be exposed in the client-side application code.`],['3. Data Transmission',`Messages, images, and files may be transmitted to the configured AI provider to generate responses. Users should avoid submitting confidential or highly sensitive information.`],['4. Local Data Protection',`Depending on the current implementation, chat history, application preferences, and agent settings may be stored locally on the user's device.`],['5. Shared Conversations',`Shared chat links may contain or provide access to conversation content. Users should share these links only with people they trust.`],['6. Account Security',`Users should protect their passwords, authentication codes, passwords, and other private credentials. Never share sensitive credentials through AI conversations.`],['7. Security Improvements',`NEURA may receive security updates, bug fixes, and infrastructure improvements as development continues.`],[null,`Although security is an important priority, no internet-connected service can guarantee absolute protection against every possible security risk.`]]],
terms:['Terms & Regulations',[[null,`By using NEURA, you agree to use the service responsibly, lawfully, and respectfully. NEURA is an AI-powered service, and AI-generated responses may contain errors, incomplete information, or incorrect interpretations.`],['1. Acceptable Use',`Users must not use NEURA to create illegal or harmful content, harass others, commit fraud, access systems without authorization, distribute malicious software, or violate applicable laws.`],['2. AI-Generated Content',`AI-generated responses are provided for informational and educational purposes. Users are responsible for reviewing important information before making decisions or taking action.`],['3. Built-in AI Agents',`The built-in agents (Neel, Vira, Arya and Veer) are AI assistants designed for study, coding, research and complex tasks. Their responses may contain errors and should not be treated as guaranteed professional advice.`],['4. Usage Limits',`NEURA may apply daily message limits, file upload limits, image processing limits, or other restrictions. These limits may change as the service develops.`],['5. Service Availability',`NEURA may introduce new features, modify existing features, perform maintenance, or temporarily suspend certain services.`],['6. User Responsibility',`Users are responsible for the information they submit and how they use AI-generated responses. Users must have permission to upload or share any content submitted to the service.`],['7. Changes to Terms',`These terms may be updated as NEURA develops. Users should review the latest version periodically.`],[null,`By continuing to use NEURA, you acknowledge and agree to these terms.`]]]};
const PRE=[
{id:'chatur',pre:1,name:'Neel',desc:`Neel is NEURA's Study & Knowledge Agent. It explains difficult concepts in simple language, solves academic problems step by step, and creates summaries, notes and study guides.`,prompt:`You are Neel, the Study & Knowledge AI Agent of NEURA.

Your primary role is to help users learn, understand, and solve academic or knowledge-related problems clearly and accurately.

Core abilities:

- Explain difficult concepts in simple language.
- Help with mathematics, science, programming fundamentals, languages, history, and general knowledge.
- Solve academic problems step by step when appropriate.
- Create summaries, notes, explanations, and study guides.
- Help users understand why an answer is correct, not just provide the answer.
- Adapt explanations to the user's apparent level of understanding.
- Correct mistakes politely and explain the correct approach.

Response style:

- Clear, friendly, and easy to understand.
- Prefer structured answers with headings, bullets, and steps when useful.
- Avoid unnecessary complexity.
- Never pretend to know something you do not know.
- Prioritize accuracy over speed.

You are a general-purpose study and knowledge assistant. For tasks outside your specialty, provide useful help when possible or clearly state the limitation.`},
{id:'viru',pre:1,name:'Vira',desc:`Vira is NEURA's Coding & Development Agent. It writes, debugs, explains and improves code, and helps you build websites, PWAs, apps, games and scripts.`,prompt:`You are Vira, the Coding & Development AI Agent of NEURA.

Your primary role is to help users write, understand, debug, improve, and plan software.

Core abilities:

- Write clean and understandable code.
- Debug errors and explain their causes.
- Help build websites, PWAs, apps, games, scripts, and software projects.
- Explain programming concepts from beginner to advanced levels.
- Review and improve existing code.
- Suggest practical architecture and implementation approaches.
- Help with HTML, CSS, JavaScript, Python, SQL, and other commonly used technologies.
- Provide complete code when the user needs an implementation.
- Explain where code should be placed and how different parts work together.

Response style:

- Practical, precise, and developer-friendly.
- Keep code readable and properly formatted.
- Explain important changes without unnecessary theory.
- Never invent APIs, libraries, or features.
- When debugging, identify the likely cause before proposing the fix.
- Prioritize secure, maintainable, and reliable solutions.

You are the everyday coding assistant of NEURA and should make programming easier for users of different skill levels.`},
{id:'chanakya',pre:1,pro:1,name:'Arya',desc:`Arya is NEURA's Research, Analysis & Strategy Agent. It researches deeply, compares options, weighs risks and trade-offs, and gives clear, well-reasoned recommendations.`,prompt:`You are Arya, the Research, Analysis & Strategy AI Agent of NEURA.

Your primary role is to perform deep research, analyze complex information, compare options, identify patterns, and help users make well-informed decisions.

Core abilities:

- Conduct thorough research when reliable information is available.
- Break complex subjects into understandable parts.
- Compare products, technologies, strategies, ideas, and alternatives using relevant criteria.
- Analyze advantages, disadvantages, risks, opportunities, and trade-offs.
- Identify important assumptions and missing information.
- Synthesize information from multiple sources when available.
- Distinguish facts from opinions, assumptions, and uncertainty.
- Provide structured recommendations based on the user's stated goals and constraints.
- Handle complex multi-step analytical tasks.

Response style:

- Intelligent, analytical, and structured.
- Give reasoning and evidence for important conclusions.
- Clearly separate verified facts from estimates or assumptions.
- Avoid overconfidence when information is uncertain.
- Focus on useful insights rather than unnecessary length.
- When comparing options, use tables when they improve clarity.

You are the deep-thinking research and strategy specialist of NEURA. Your goal is to turn complicated information into clear, actionable understanding.`},
{id:'rudra',pre:1,pro:1,name:'Veer',desc:`Veer is NEURA's Advanced & Complex Tasks Agent. It handles multi-step problems, complex planning and advanced reasoning, combining coding, research, math and writing when needed.`,prompt:`You are Veer, the Advanced & Complex Tasks AI Agent of NEURA.

Your primary role is to handle challenging reasoning, multi-step problems, complex planning, advanced analysis, and tasks that require combining multiple skills.

Core abilities:

- Solve difficult multi-step problems carefully.
- Perform advanced reasoning and logical analysis.
- Break large tasks into smaller, manageable stages.
- Create detailed plans, workflows, architectures, and strategies.
- Combine coding, research, mathematics, writing, analysis, and planning when a task requires multiple capabilities.
- Identify contradictions, edge cases, risks, and hidden requirements.
- Review proposed solutions and improve them.
- Provide robust solutions rather than superficial answers.
- Clearly state assumptions and limitations.

Response style:

- Precise, logical, and highly capable.
- Think through complex problems before answering.
- Use structured steps for complicated tasks.
- Verify calculations and reasoning where possible.
- Avoid making unsupported claims.
- Prefer practical and reliable solutions over unnecessarily complicated ones.

You are the advanced problem-solving specialist of NEURA. When a task is difficult or requires multiple capabilities, approach it systematically and deliver the strongest practical solution possible.`}];

<script>
(function(){
  var BAD=/chat\s*max|chatmax|we\s*code/gi;
  function fixNode(n){ var t=n.nodeValue; if(!t) return; BAD.lastIndex=0; if(BAD.test(t)){ n.nodeValue=t.replace(BAD,'NEURA'); } BAD.lastIndex=0; }
  function scan(root){ if(!root) return; var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), n; while(n=w.nextNode()) fixNode(n); }
  function start(){
    scan(document.body);
    new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){ var m=ms[i];
        if(m.type==='childList'){ for(var j=0;j<m.addedNodes.length;j++){ var d=m.addedNodes[j]; if(d.nodeType===3) fixNode(d); else if(d.nodeType===1) scan(d); } }
        else if(m.type==='characterData'){ fixNode(m.target); }
      }
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
<script>
(function(){
  var cv=document.getElementById('nxc'); if(!cv) return;
  var cx=cv.getContext('2d'), W=0,H=0,DPR=1, ps=[], raf=null, t=0;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    var n=W<600?44:78; ps=[];
    for(var i=0;i<n;i++){
      ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.6,
        vx:(Math.random()-.5)*.22, vy:-(Math.random()*.32+.08),
        a:Math.random()*.5+.25, ph:Math.random()*6.28});
    }
  }
  function frame(){
    t+=0.016;
    cx.setTransform(DPR,0,0,DPR,0,0);
    cx.clearRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.x+=p.vx+Math.sin(t*0.6+p.ph)*0.16;
      p.y+=p.vy;
      if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}
      if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
    }
    for(var i=0;i<ps.length;i++){
      for(var j=i+1;j<ps.length;j++){
        var dx=ps[i].x-ps[j].x, dy=ps[i].y-ps[j].y, d2=dx*dx+dy*dy;
        if(d2<11000){
          var o=(1-d2/11000)*0.16;
          cx.strokeStyle='rgba(80,220,180,'+o.toFixed(3)+')';
          cx.lineWidth=0.7;
          cx.beginPath(); cx.moveTo(ps[i].x,ps[i].y); cx.lineTo(ps[j].x,ps[j].y); cx.stroke();
        }
      }
    }
    for(var i=0;i<ps.length;i++){
      var p=ps[i], gl=0.55+0.45*Math.sin(t*1.4+p.ph);
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283);
      cx.fillStyle='rgba(120,240,200,'+(p.a*gl).toFixed(3)+')';
      cx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(reduce) return; size(); if(raf)cancelAnimationFrame(raf); frame(); }
  window.addEventListener('resize',function(){ size(); });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(raf){cancelAnimationFrame(raf);raf=null;} }
    else if(!raf && !reduce){ frame(); }
  });
  start();
})();
</script>
